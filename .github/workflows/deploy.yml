name: Deploy to GitHub Pages

on:
  # The canonical site is deployed by Cloudflare. The full site exceeds
  # GitHub Pages' 1 GB limit, so this optional mirror is manual-only.
  workflow_dispatch:

# Pages 部署需要的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 确保只有一个部署任务同时运行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.14.4
          run_install: false
          
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      
      - name: Build site
        env:
          PRIVATE_POST_PASSWORD: ${{ secrets.PRIVATE_POST_PASSWORD }}
        run: pnpm run build

      - name: Check Pages site size
        run: |
          node --input-type=module <<'NODE'
          import { readdir, stat } from 'node:fs/promises';
          import path from 'node:path';
          async function bytes(directory) {
            let total = 0;
            for (const item of await readdir(directory, { withFileTypes: true })) {
              const file = path.join(directory, item.name);
              total += item.isDirectory() ? await bytes(file) : (await stat(file)).size;
            }
            return total;
          }
          const size = await bytes('dist');
          if (size > 1_000_000_000) {
            console.error('GitHub Pages supports sites up to 1 GB. Use the existing Cloudflare production deployment for this site.');
            process.exit(1);
          }
          NODE

      - name: Create .nojekyll file
        run: touch dist/.nojekyll
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist  # Astro默认构建输出目录

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
